name: 빌드 및 릴리스

# main에 push될 때 package.json의 version에 해당하는 릴리스(v1.2.3)가 아직 없으면
# Windows 설치 파일을 빌드해 릴리스로 게시합니다. (Actions 탭에서 수동 실행도 가능)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 새 버전인지 확인
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" >/dev/null 2>&1; then  # 게시된 릴리스만 조회됨(초안 제외)
            echo "v$V 릴리스가 이미 있어 빌드를 건너뜁니다."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        if: steps.ver.outputs.build == 'true'
        run: npm ci

      - name: 설치 파일 빌드
        if: steps.ver.outputs.build == 'true'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: 릴리스 게시
        if: steps.ver.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          # 실패한 이전 시도가 남긴 같은 버전의 초안이 있으면 정리
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and (.tag_name==\"v$V\" or .name==\"$V\")) | .id" \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release create "v$V" \
            "dist/ScheduleTodo-Setup-$V.exe" "dist/ScheduleTodo-Setup-$V.exe.blockmap" dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$V" \
            --notes "$(git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):')" --latest
