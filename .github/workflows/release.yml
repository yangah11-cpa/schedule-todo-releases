name: 빌드 및 릴리스

# main에 push될 때 package.json의 version에 해당하는 릴리스(v1.2.3)가 아직 없으면
# Windows 설치 파일을 빌드해 릴리스로 게시합니다. (Actions 탭에서 수동 실행도 가능)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 새 버전인지 확인
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # 게시된 릴리스가 있고 업데이트 정보(latest.yml)까지 올라가 있으면 완료된 버전
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" --jq '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "v$V 릴리스가 이미 있어 빌드를 건너뜁니다."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        if: steps.ver.outputs.build == 'true'
        run: npm ci

      - name: 설치 파일 빌드
        if: steps.ver.outputs.build == 'true'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: 릴리스 게시
        if: steps.ver.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          # 실패한 이전 시도가 남긴 같은 버전의 릴리스(초안·불완전 게시)와 태그를 정리
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"v$V\" or .name==\"$V\") | .id" \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$V" 2>/dev/null || true
          gh release create "v$V" \
            "dist/ScheduleTodo-Setup-$V.exe" "dist/ScheduleTodo-Setup-$V.exe.blockmap" dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$V" \
            --notes-file RELEASE_NOTES.md --latest
