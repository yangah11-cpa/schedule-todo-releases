<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>일정 &amp; 할일</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img src="../icon.png" alt="" width="22" height="22">
      <span>일정 &amp; 할일</span>
    </div>
    <div class="apptabs" role="tablist">
      <button type="button" role="tab" data-apptab="main" class="on">📅 일정</button>
      <button type="button" role="tab" data-apptab="mail">✉ 메일<span class="mbadge" id="mailSumBadge" hidden></span></button>
      <button type="button" role="tab" data-apptab="team">👥 팀 일정</button>
    </div>
    <div class="spacer"></div>
    <button class="btn primary" id="btnUpdate" type="button" hidden></button>
    <div class="sync-status" id="syncStatus"></div>
    <button class="btn" id="btnSync" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>지금 동기화
    </button>
    <button class="btn icon" id="btnSettings" type="button" aria-label="설정" title="설정">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="ai-meter" id="aiMeter" type="button" hidden></button>
  </header>

  <main class="main">
    <section class="panel cal" aria-label="일정관리">
      <div class="cal-head">
        <div class="row gap4 nav">
          <button class="btn sq" id="btnPrevYear" type="button" aria-label="이전 해" title="이전 해">«</button>
          <button class="btn sq" id="btnPrev" type="button" aria-label="이전" title="이전 달">‹</button>
          <button class="btn" id="btnToday" type="button">오늘</button>
          <button class="btn sq" id="btnNext" type="button" aria-label="다음" title="다음 달">›</button>
          <button class="btn sq" id="btnNextYear" type="button" aria-label="다음 해" title="다음 해">»</button>
        </div>
        <h2 id="calTitle"></h2>
        <span class="muted small" id="calLunarRange"></span>
        <div class="spacer"></div>
        <div class="seg" role="group" aria-label="보기">
          <button type="button" data-view="month">월</button>
          <button type="button" data-view="week">주</button>
          <button type="button" data-view="day">일</button>
        </div>
        <button class="btn" id="btnTeamImport" type="button" title="팀 일정표 엑셀에서 내 일정 등록">팀 일정 등록</button>
        <button class="btn primary" id="btnAddEvent" type="button">+ 일정</button>
      </div>
      <div class="cal-body" id="calBody"></div>
      <div class="legend">
        <span><span class="chip g">일정</span>Google 캘린더</span>
        <span><span class="chip c">일정</span>이 PC에만</span>
        <span><span class="chip l">음 ↻</span>음력 연간 반복</span>
        <span><span class="chip t">할 일</span>기한 있는 할 일</span>
        <span><span class="chip h">공휴일</span>공휴일</span>
        <label class="push"><input type="checkbox" id="chkLunar">음력 날짜 표시</label>
      </div>
    </section>

    <aside class="panel todo" aria-label="할 일">
      <div class="todo-head">
        <div class="row baseline gap10">
          <h2>할 일</h2>
          <span class="muted small" id="todoCount"></span>
        </div>
        <form id="quickForm" class="row gap8">
          <label for="quick" class="sr">새 할 일</label>
          <input id="quick" class="inp grow" autocomplete="off" placeholder="할 일 입력 후 Enter  (예: 매주 월 주간보고)">
          <button type="button" class="btn icon tall" id="btnTodoDialog" aria-label="기한·반복 설정" title="기한·반복 설정">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
          </button>
        </form>
        <div class="tabs" role="tablist" id="todoTabs"></div>
      </div>
      <div class="todo-list" id="todoList"></div>
    </aside>
  </main>
  <main class="mailview" id="mailView" hidden></main>
  <main class="teamview" id="teamView" hidden></main>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
